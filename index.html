<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="한 척의 배와 선원으로 세 개의 해역을 돌파하는 브라우저 로그라이크, Devour the Throne."
    />
    <meta property="og:title" content="Devour the Throne" />
    <meta
      property="og:description"
      content="분기 항로, 자원 관리, 포격과 접안 전투, 전승 성장이 담긴 브라우저 로그라이크."
    />
    <meta name="theme-color" content="#071a24" />
    <title>Devour the Throne</title>
    <link rel="stylesheet" href="./styles.css?v=20260811a" />
  </head>
  <body>
    <main class="game-shell">
      <header class="topbar">
        <div class="brand-lockup">
          <span class="brand-mark" aria-hidden="true">☠</span>
          <div>
            <h1>Devour <span>the Throne</span></h1>
          </div>
        </div>

        <div class="voyage-strip" aria-label="항해 진행 상황">
          <div>
            <span>해역</span>
            <strong id="actLabel">출항 준비</strong>
          </div>
          <div title="이번 항해에서 쌓은 악명입니다. 항해가 끝나면 전승 악명에 합산되어 유산 강화에 사용됩니다. 악명이 높을수록 선장 특수 스킬의 위력이 강해집니다.">
            <span>악명</span>
            <strong id="infamyLabel">0</strong>
          </div>
          <div title="이전 항해들에서 누적된 전승 악명입니다. 해적왕의 유산 강화를 구매하는 데 사용합니다. 이번 항해의 악명과 달리 전투 위력에는 영향을 주지 않습니다.">
            <span>전승</span>
            <strong id="legacyLabel">0</strong>
          </div>
          <button id="statsButton" class="icon-button" type="button" title="통계 보기" aria-label="통계 보기">▤</button>
          <button id="soundButton" class="icon-button" type="button" title="소리 끄기" aria-label="소리 끄기">♪</button>
        </div>
      </header>

      <div class="game-grid">
        <section class="viewport-panel" aria-label="항해 지도와 전투 화면">
          <div class="canvas-wrap">
            <canvas
              id="gameCanvas"
              width="1200"
              height="700"
              aria-label="항해 지도"
            ></canvas>

            <div id="modalLayer" class="modal-layer" role="dialog" aria-modal="true">
              <div id="modalPanel" class="modal-panel"></div>
            </div>

            <div
              id="windInfo"
              class="wind-info game-tooltip tooltip-below"
              tabindex="0"
              data-tooltip="풍향(순풍·측풍·역풍)과 풍속(화살표 1~3단계)입니다. 순풍이면 포격·사슬탄 명중률 +6%p, 역풍이면 -10%p(병 속의 폭풍 유물 보유 시 무효)이며, 측풍은 명중률에 영향이 없습니다. 순풍 전용 카드(순풍 돌입 등)는 순풍일 때만 사용할 수 있습니다."
              aria-label="풍향 설명"
            ></div>
          </div>

          <div id="actionDock" class="action-dock" aria-live="polite"></div>
        </section>

        <aside class="ship-panel" aria-label="선박 상태">
          <section class="ship-card identity-card">
            <div class="section-heading">
              <div>
                <p class="eyebrow">YOUR VESSEL</p>
                <h2 id="shipNameLabel">무명의 돛단배</h2>
              </div>
              <div class="item-actions">
                <button id="deckButton" class="text-button" type="button" disabled>덱 0장</button>
                <span id="captainBadge" class="captain-badge">선장 미정</span>
              </div>
            </div>
          </section>

          <section class="ship-card vitals-card">
            <div
              class="meter-row game-tooltip"
              tabindex="0"
              data-tooltip="적의 포격과 접안 공격, 일부 조우로 감소합니다. 선체가 0이 되면 구사일생을 소모하거나 항해가 끝납니다."
              aria-label="선체 0 / 0"
              aria-description="적의 포격과 접안 공격, 일부 조우로 감소합니다. 선체가 0이 되면 구사일생을 소모하거나 항해가 끝납니다."
            >
              <div class="meter-copy">
                <span>선체</span>
                <strong id="hullLabel">0 / 0</strong>
              </div>
              <div class="meter hull-meter" aria-hidden="true"><span id="hullMeter"></span></div>
            </div>
            <div
              class="meter-row game-tooltip"
              tabindex="0"
              data-tooltip="접근 기동 성공률에 영향을 줍니다. 돛이 0이면 접근 기동과 회피 기동을 사용할 수 없습니다."
              aria-label="돛 0 / 0"
              aria-description="접근 기동 성공률에 영향을 줍니다. 돛이 0이면 접근 기동과 회피 기동을 사용할 수 없습니다."
            >
              <div class="meter-copy">
                <span>돛</span>
                <strong id="sailsLabel">0 / 0</strong>
              </div>
              <div class="meter sails-meter" aria-hidden="true"><span id="sailsMeter"></span></div>
            </div>
            <div
              class="meter-row game-tooltip"
              tabindex="0"
              data-tooltip="선원들의 전투 의지입니다. 이동 중 보급 고갈과 전투 피해로 감소하며, 사기가 0이 되면 선상 반란으로 항해가 끝납니다. 무감한 선원이 있으면 식량·식수 고갈로 인한 사기 피해를 받지 않습니다. 사기가 높을수록 포격·사슬탄 공격의 피해가 두 번 굴려 더 높은 값을 채택하는 방식으로 유리하게 보정됩니다."
              aria-label="사기 0 / 100"
              aria-description="선원들의 전투 의지입니다. 이동 중 보급 고갈과 전투 피해로 감소하며, 사기가 0이 되면 선상 반란으로 항해가 끝납니다. 무감한 선원이 있으면 식량·식수 고갈로 인한 사기 피해를 받지 않습니다. 사기가 높을수록 포격·사슬탄 공격의 피해가 두 번 굴려 더 높은 값을 채택하는 방식으로 유리하게 보정됩니다."
            >
              <div class="meter-copy">
                <span>사기</span>
                <strong id="moraleLabel">0 / 100</strong>
              </div>
              <div class="meter morale-meter" aria-hidden="true"><span id="moraleMeter"></span></div>
            </div>
          </section>

          <section class="ship-card cargo-card">
            <div
              class="resource-cell game-tooltip tooltip-align-left"
              tabindex="0"
              data-tooltip="항로의 노드를 이동할 때 소모합니다. 식량이 바닥난 채 이동하면 사기가 크게 감소합니다. 무감한 선원이 있으면 식량·식수 고갈로 인한 사기 피해를 받지 않습니다."
              aria-label="식량 0"
              aria-description="항로의 노드를 이동할 때 소모합니다. 식량이 바닥난 채 이동하면 사기가 크게 감소합니다. 무감한 선원이 있으면 식량·식수 고갈로 인한 사기 피해를 받지 않습니다."
            >
              <span class="resource-icon food-icon" aria-hidden="true"></span>
              <div><span>식량</span><strong id="foodLabel">0</strong></div>
            </div>
            <div
              class="resource-cell game-tooltip tooltip-align-right"
              tabindex="0"
              data-tooltip="항로의 노드를 이동할 때 소모합니다. 식수가 바닥난 채 이동하면 식량 고갈보다 더 큰 사기 피해를 받습니다. 무감한 선원이 있으면 식량·식수 고갈로 인한 사기 피해를 받지 않습니다."
              aria-label="식수 0"
              aria-description="항로의 노드를 이동할 때 소모합니다. 식수가 바닥난 채 이동하면 식량 고갈보다 더 큰 사기 피해를 받습니다. 무감한 선원이 있으면 식량·식수 고갈로 인한 사기 피해를 받지 않습니다."
            >
              <span class="resource-icon water-icon" aria-hidden="true"></span>
              <div><span>식수</span><strong id="waterLabel">0</strong></div>
            </div>
            <div
              class="resource-cell game-tooltip tooltip-align-left"
              tabindex="0"
              data-tooltip="항구에서 보급품, 수리, 선원 모집, 사기 회복, 수리 도구 구매에 사용합니다. 전투와 조우에서 획득합니다."
              aria-label="금화 0"
              aria-description="항구에서 보급품, 수리, 선원 모집, 사기 회복, 수리 도구 구매에 사용합니다. 전투와 조우에서 획득합니다."
            >
              <span class="resource-icon gold-icon" aria-hidden="true"></span>
              <div><span>금화</span><strong id="goldLabel">0</strong></div>
            </div>
            <div
              class="resource-cell game-tooltip tooltip-align-right"
              tabindex="0"
              data-tooltip="함선의 기본 대포와 포수 효과를 합친 포격 공격력입니다. 포격 피해는 이 수치 전체를, 사슬탄 피해는 포수 효과만 사용합니다."
              aria-label="화력 0"
              aria-description="함선의 기본 대포와 포수 효과를 합친 포격 공격력입니다. 포격 피해는 이 수치 전체를, 사슬탄 피해는 포수 효과만 사용합니다."
            >
              <span class="resource-icon cannon-icon" aria-hidden="true"></span>
              <div><span>화력</span><strong id="cannonLabel">0</strong></div>
            </div>
          </section>

          <section class="ship-card crew-card">
            <div
              class="section-heading compact game-tooltip"
              tabindex="0"
              data-tooltip="선원은 역할·등급·특성에 따라 항해와 전투를 강화합니다. 합산 전투력은 접안 공격 성공률과 적의 난입 판정에 사용됩니다."
              aria-label="선원 목록 · 전투력 0"
              aria-description="선원은 역할·등급·특성에 따라 항해와 전투를 강화합니다. 합산 전투력은 접안 공격 성공률과 적의 난입 판정에 사용됩니다."
            >
              <h2>선원</h2>
              <strong id="crewPowerLabel">전투력 0</strong>
            </div>
            <div id="crewList" class="crew-list"></div>
          </section>

          <section class="ship-card artifact-card">
            <div class="section-heading compact">
              <h2>유물</h2>
              <span id="artifactCount">0</span>
            </div>
            <div id="artifactList" class="artifact-list"></div>
          </section>

          <section class="ship-card log-card">
            <div class="section-heading compact">
              <h2>항해일지</h2>
              <button id="newVoyageButton" class="text-button" type="button">새 항해</button>
            </div>
            <ol id="eventLog" class="event-log" aria-live="polite"></ol>
          </section>
        </aside>
      </div>
    </main>

    <script defer src="./src/analytics.js?v=20260804a"></script>
    <script defer src="./src/card-definitions.js?v=20260804a"></script>
    <script defer src="./src/card-engine.js?v=20260804a"></script>
    <script defer src="./src/fleet-combat.js?v=20260804a"></script>
    <script defer src="./src/game.js?v=20260804a"></script>
  </body>
</html>
